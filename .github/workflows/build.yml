name: Build
on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"
      - run: gradle :app:assembleRelease --stacktrace
      - name: Name the APK
        run: |
          cp app/build/outputs/apk/release/app-release.apk DrainScout.apk
          ls -l DrainScout.apk
      - uses: actions/upload-artifact@v4
        with:
          name: DrainScout-apk
          path: DrainScout.apk
      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          name: 🔋 DrainScout ${{ github.ref_name }}
          body_path: RELEASE_NOTES.md
          files: DrainScout.apk
